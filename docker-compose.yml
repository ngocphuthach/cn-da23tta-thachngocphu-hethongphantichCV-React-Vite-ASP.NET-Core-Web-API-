name: cvadvisor

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU23-ubuntu-22.04
    container_name: cvadvisor-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in the root .env file}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL in the root .env file}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in the root .env file}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in the root .env file}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in the root .env file}
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=CvAdvisorDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      AiService__BaseUrl: http://ai-service:8000/
      AiService__InternalApiKey: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the root .env file}
      Storage__CvRoot: /app/storage
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN-}
    ports:
      - "127.0.0.1:5000:8080"
    volumes:
      - cv-files:/app/storage
    depends_on:
      sqlserver:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "busybox",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mssql-data:
    name: cvadvisor-mssql-data
  cv-files:
    name: cvadvisor-cv-files
